name: Bizongo
description: 'Bizongo is a Mumbai-based B2B commerce and supply-chain platform founded in 2015 that
  digitizes procurement, vendor management, and supply-chain financing for enterprises across India,
  with a focus on packaging, raw materials, and made-to-order goods. It operates a SaaS-led vendor
  digitization stack plus an embedded-finance offering, connecting large buyers with a network of
  manufacturing partners. Bizongo is backed by Accel, Chiratae Ventures, B Capital, and others. It
  was added to the API Evangelist network as a portfolio-lead stub; as of this enrichment pass Bizongo
  publishes no public developer portal, API reference, OpenAPI definition, or /.well-known discovery
  surface — third-party logistics integration is offered only through carrier aggregators such as
  ClickPost, so most API-artifact scoring dimensions are not applicable.'
